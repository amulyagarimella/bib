<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reading list</title>
    <meta name="robots" content="noindex" />
    <style>
      /* Valley Sans (SIL OFL). "Medium" stands in for every bold weight;
         Regular/Italic carry everything else. font-synthesis:none below
         stops the browser from faking bolds or slants. */
      @font-face {
        font-family: "Valley Sans";
        src: url("/assets/fonts/ValleySans-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Valley Sans";
        src: url("/assets/fonts/ValleySans-Italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "Valley Sans";
        src: url("/assets/fonts/ValleySans-Medium.woff2") format("woff2");
        /* Range so any "bold" (500–900) resolves to Medium, never heavier. */
        font-weight: 500 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Valley Sans";
        src: url("/assets/fonts/ValleySans-MediumItalic.woff2") format("woff2");
        font-weight: 500 900;
        font-style: italic;
        font-display: swap;
      }

      :root {
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --faint: #9a9a9a;
        --line: #e6e6e6;
        --accent: #0b4f9c;
        --bg: #fbfbfa;
        --max: 760px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Valley Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: var(--max);
        margin: 0 auto;
        padding: 64px 24px 96px;
      }

      header.page {
        margin-bottom: 36px;
      }

      h1 {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }

      .subtitle {
        color: var(--muted);
        font-size: 15px;
        margin: 0;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 28px 0 8px;
      }

      input[type="search"] {
        flex: 1;
        font: inherit;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }

      input[type="search"]:focus {
        outline: none;
        border-color: var(--accent);
      }

      .count {
        color: var(--faint);
        font-size: 13px;
        white-space: nowrap;
      }

      .refresh {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: inherit;
        font-size: 13px;
        color: var(--muted);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 12px;
        cursor: pointer;
        white-space: nowrap;
        transition: border-color 0.15s ease, color 0.15s ease;
      }

      .refresh:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }

      .refresh:disabled {
        cursor: default;
        opacity: 0.6;
      }

      .refresh svg {
        width: 14px;
        height: 14px;
      }

      .refresh.loading svg {
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .group-year {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 36px 0 4px;
      }

      article.item {
        padding: 18px 0;
        border-top: 1px solid var(--line);
      }

      .item-title {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.35;
        margin: 0 0 4px;
      }

      .item-title a {
        color: var(--ink);
        text-decoration: none;
        background-image: linear-gradient(var(--accent), var(--accent));
        background-size: 0% 1px;
        background-position: 0 100%;
        background-repeat: no-repeat;
        transition: background-size 0.2s ease, color 0.2s ease;
      }

      .item-title a:hover {
        color: var(--accent);
        background-size: 100% 1px;
      }

      .meta {
        font-size: 14px;
        color: var(--muted);
        margin: 0 0 8px;
      }

      .meta .pub {
        font-style: italic;
      }

      .meta .dot {
        color: var(--faint);
        margin: 0 6px;
      }

      .abstract {
        font-size: 14.5px;
        color: #333;
        margin: 8px 0 0;
        max-width: 64ch;
      }

      .abstract.clamped {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .more {
        display: inline-block;
        font-size: 13px;
        color: var(--accent);
        cursor: pointer;
        margin-top: 4px;
        user-select: none;
      }

      .tags {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .tag {
        font-size: 12px;
        color: var(--muted);
        background: #f0f0ee;
        padding: 2px 8px;
        border-radius: 999px;
      }

      .type-badge {
        display: inline-block;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 6px;
      }

      .state {
        color: var(--muted);
        font-size: 15px;
        padding: 48px 0;
        text-align: center;
      }

      footer {
        margin-top: 64px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        font-size: 12.5px;
      }

      @media (max-width: 600px) {
        .wrap {
          padding: 40px 18px 72px;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="page">
        <h1 id="page-title">Reading list</h1>
      </header>

      <div class="controls" hidden id="controls">
        <input type="search" id="search" placeholder="Filter by title, author, journal, tag…" autocomplete="off" />
        <span class="count" id="count"></span>
        <button class="refresh" id="refresh" type="button" title="Fetch the latest from Zotero (bypasses cache)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
          <span>Reload</span>
        </button>
      </div>

      <main id="list">
        <div class="state">Loading…</div>
      </main>

      <footer>Maintained in Zotero · Live</footer>
    </div>

    <script>
      // ---- Configure the page heading here (purely cosmetic) ----
      const PAGE_TITLE = "Reading list";
      const PAGE_SUBTITLE = "A curated set of references.";

      document.getElementById("page-title").textContent = PAGE_TITLE;
      document.getElementById("page-subtitle").textContent = PAGE_SUBTITLE;
      document.title = PAGE_TITLE;

      const listEl = document.getElementById("list");
      const countEl = document.getElementById("count");
      const controlsEl = document.getElementById("controls");
      const searchEl = document.getElementById("search");
      const refreshEl = document.getElementById("refresh");

      let allItems = [];

      function yearOf(date) {
        const m = (date || "").match(/\b(1[5-9]\d{2}|20\d{2})\b/);
        return m ? m[1] : "";
      }

      function formatCreators(creators) {
        const names = (creators || [])
          .map((c) => {
            if (c.name) return c.name;
            const last = c.lastName || "";
            const initial = c.firstName ? `${c.firstName.trim()[0]}.` : "";
            return [last, initial].filter(Boolean).join(", ");
          })
          .filter(Boolean);
        if (names.length === 0) return "";
        if (names.length <= 6) return names.join("; ");
        return names.slice(0, 6).join("; ") + " et al.";
      }

      function el(tag, attrs = {}, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") node.className = v;
          else if (k === "html") node.innerHTML = v;
          else node.setAttribute(k, v);
        }
        for (const child of children) {
          if (child == null) continue;
          node.append(child.nodeType ? child : document.createTextNode(child));
        }
        return node;
      }

      function renderItem(item) {
        const article = el("article", { class: "item" });

        if (item.itemType) {
          article.append(
            el("div", { class: "type-badge" }, item.itemType.replace(/([A-Z])/g, " $1").trim())
          );
        }

        const titleNode = item.url
          ? el("a", { href: item.url, target: "_blank", rel: "noopener" }, item.title)
          : document.createTextNode(item.title);
        article.append(el("h2", { class: "item-title" }, titleNode));

        const metaParts = [];
        const authors = formatCreators(item.creators);
        const year = yearOf(item.date);
        const meta = el("p", { class: "meta" });
        if (authors) meta.append(authors);
        if (year) {
          if (authors) meta.append(el("span", { class: "dot" }, "·"));
          meta.append(year);
        }
        if (item.publication) {
          if (authors || year) meta.append(el("span", { class: "dot" }, "·"));
          meta.append(el("span", { class: "pub" }, item.publication));
        }
        if (meta.childNodes.length) article.append(meta);

        if (item.abstractNote) {
          const abs = el("p", { class: "abstract clamped" }, item.abstractNote);
          article.append(abs);
          const isLong = item.abstractNote.length > 280;
          if (isLong) {
            const toggle = el("span", { class: "more" }, "Show more");
            toggle.addEventListener("click", () => {
              const clamped = abs.classList.toggle("clamped");
              toggle.textContent = clamped ? "Show more" : "Show less";
            });
            article.append(toggle);
          } else {
            abs.classList.remove("clamped");
          }
        }

        if (item.tags && item.tags.length) {
          const tagWrap = el("div", { class: "tags" });
          item.tags.forEach((t) => tagWrap.append(el("span", { class: "tag" }, t)));
          article.append(tagWrap);
        }

        return article;
      }

      function render(items) {
        listEl.innerHTML = "";
        if (items.length === 0) {
          listEl.append(el("div", { class: "state" }, "No matching references."));
          countEl.textContent = "";
          return;
        }

        countEl.textContent = `${items.length} reference${items.length === 1 ? "" : "s"}`;

        let lastYear = null;
        for (const item of items) {
          const year = yearOf(item.date) || "Undated";
          if (year !== lastYear) {
            listEl.append(el("div", { class: "group-year" }, year));
            lastYear = year;
          }
          listEl.append(renderItem(item));
        }
      }

      function matches(item, q) {
        if (!q) return true;
        const hay = [
          item.title,
          item.publication,
          formatCreators(item.creators),
          (item.tags || []).join(" "),
        ]
          .join(" ")
          .toLowerCase();
        return q
          .toLowerCase()
          .split(/\s+/)
          .filter(Boolean)
          .every((term) => hay.includes(term));
      }

      function applyFilter() {
        const q = searchEl.value.trim();
        render(allItems.filter((it) => matches(it, q)));
      }

      searchEl.addEventListener("input", applyFilter);

      async function load({ force = false } = {}) {
        // A unique query param + no-store busts both the browser cache and
        // Vercel's edge cache, so "Reload" pulls fresh data straight from Zotero.
        const url = force ? `/api/items?refresh=${Date.now()}` : "/api/items";
        const res = await fetch(url, force ? { cache: "no-store" } : undefined);
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `Request failed (${res.status})`);
        }
        const data = await res.json();
        allItems = data.items || [];
        controlsEl.hidden = false;
        applyFilter();
      }

      refreshEl.addEventListener("click", async () => {
        refreshEl.disabled = true;
        refreshEl.classList.add("loading");
        try {
          await load({ force: true });
        } catch (e) {
          countEl.textContent = "Reload failed";
        } finally {
          refreshEl.disabled = false;
          refreshEl.classList.remove("loading");
        }
      });

      (async () => {
        try {
          await load();
        } catch (e) {
          listEl.innerHTML = "";
          listEl.append(
            el("div", { class: "state" }, "Couldn't load references. " + e.message)
          );
        }
      })();
    </script>
  </body>
</html>
