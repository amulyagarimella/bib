<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared collections</title>
    <meta name="robots" content="noindex" />
    <style>
      @font-face {
        font-family: "Valley Sans";
        src: url("/assets/fonts/ValleySans-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Valley Sans";
        src: url("/assets/fonts/ValleySans-Italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: "Valley Sans";
        src: url("/assets/fonts/ValleySans-Medium.woff2") format("woff2");
        font-weight: 500 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --faint: #9a9a9a;
        --line: #e6e6e6;
        --accent: #0b4f9c;
        --bg: #fbfbfa;
        --max: 720px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Valley Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: var(--max);
        margin: 0 auto;
        padding: 64px 24px 96px;
      }

      h1 {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }

      .subtitle {
        color: var(--muted);
        font-size: 15px;
        margin: 0 0 36px;
      }

      h2 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 40px 0 12px;
      }

      /* ---- share list ---- */
      .share {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }

      .share:last-of-type {
        border-bottom: 1px solid var(--line);
      }

      .share-main {
        flex: 1;
        min-width: 0;
      }

      .share-name {
        font-weight: 600;
        font-size: 16px;
      }

      .share-name a {
        color: var(--ink);
        text-decoration: none;
      }

      .share-name a:hover {
        color: var(--accent);
      }

      .share-link {
        font-size: 13px;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .icon-btn {
        flex: none;
        font: inherit;
        font-size: 13px;
        color: var(--muted);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 11px;
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
      }

      .icon-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .icon-btn.danger:hover {
        border-color: #c0392b;
        color: #c0392b;
      }

      /* ---- add form ---- */
      form {
        margin-top: 8px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
      }

      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 4px;
      }

      .field {
        margin-bottom: 14px;
      }

      .field:last-child {
        margin-bottom: 0;
      }

      input[type="text"] {
        width: 100%;
        font: inherit;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .hint {
        font-size: 12px;
        color: var(--faint);
        margin: 4px 0 0;
      }

      button.primary {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
      }

      button.primary:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .msg {
        font-size: 13px;
        margin: 12px 0 0;
        min-height: 18px;
      }

      .msg.error {
        color: #c0392b;
      }

      .msg.ok {
        color: #1e7e34;
      }

      .state {
        color: var(--muted);
        font-size: 15px;
        padding: 24px 0;
      }

      @media (max-width: 600px) {
        .wrap {
          padding: 40px 18px 72px;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Shared collections</h1>
      <p class="subtitle">Each collection below is an unlisted link you can share with collaborators.</p>

      <h2>Shares</h2>
      <div id="list">
        <div class="state">Loading…</div>
      </div>

      <h2>Add a collection</h2>
      <form id="add-form">
        <div class="field">
          <label for="name">Display name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Aging &amp; circadian rhythms" required />
        </div>
        <div class="field">
          <label for="collectionKey">Zotero collection key</label>
          <input type="text" id="collectionKey" name="collectionKey" placeholder="e.g. ABCD2345" required />
          <p class="hint">The code after <code>/collections/</code> in the collection's Zotero web-library URL.</p>
        </div>

        <button type="submit" class="primary" id="submit">Add collection</button>
        <p class="msg" id="msg"></p>
      </form>
    </div>

    <script>
      const listEl = document.getElementById("list");
      const formEl = document.getElementById("add-form");
      const submitEl = document.getElementById("submit");
      const msgEl = document.getElementById("msg");

      function el(tag, attrs = {}, ...children) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "class") node.className = v;
          else node.setAttribute(k, v);
        }
        for (const child of children) {
          if (child == null) continue;
          node.append(child.nodeType ? child : document.createTextNode(child));
        }
        return node;
      }

      function shareUrl(slug) {
        return `${location.origin}/c/${slug}`;
      }

      function renderList(collections) {
        listEl.innerHTML = "";
        if (!collections.length) {
          listEl.append(el("div", { class: "state" }, "No collections shared yet."));
          return;
        }
        for (const c of collections) {
          const url = shareUrl(c.slug);

          const nameLine = el(
            "div",
            { class: "share-name" },
            el("a", { href: `/c/${c.slug}`, target: "_blank", rel: "noopener" }, c.name)
          );
          const linkLine = el("div", { class: "share-link" }, url);
          const main = el("div", { class: "share-main" }, nameLine, linkLine);

          const copyBtn = el("button", { class: "icon-btn", type: "button" }, "Copy link");
          copyBtn.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(url);
              copyBtn.textContent = "Copied!";
              setTimeout(() => (copyBtn.textContent = "Copy link"), 1200);
            } catch {
              copyBtn.textContent = "Copy failed";
            }
          });

          const delBtn = el("button", { class: "icon-btn danger", type: "button" }, "Delete");
          delBtn.addEventListener("click", async () => {
            if (!confirm(`Delete "${c.name}"? The link will stop working.`)) return;
            delBtn.disabled = true;
            try {
              const res = await fetch(`/api/collections?slug=${encodeURIComponent(c.slug)}`, {
                method: "DELETE",
              });
              if (!res.ok) throw new Error();
              row.remove();
              if (!listEl.querySelector(".share")) renderList([]);
            } catch {
              delBtn.disabled = false;
              delBtn.textContent = "Retry delete";
            }
          });

          const row = el("div", { class: "share" }, main, copyBtn, delBtn);
          listEl.append(row);
        }
      }

      async function loadList() {
        try {
          const res = await fetch("/api/collections");
          if (!res.ok) throw new Error(`Request failed (${res.status})`);
          const data = await res.json();
          renderList(data.collections || []);
        } catch (e) {
          listEl.innerHTML = "";
          listEl.append(el("div", { class: "state" }, "Couldn't load shares. " + e.message));
        }
      }

      formEl.addEventListener("submit", async (e) => {
        e.preventDefault();
        msgEl.textContent = "";
        msgEl.className = "msg";
        submitEl.disabled = true;

        const body = {
          name: formEl.name.value.trim(),
          collectionKey: formEl.collectionKey.value.trim(),
        };

        try {
          const res = await fetch("/api/collections", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
          msgEl.textContent = `Added "${data.collection.name}".`;
          msgEl.className = "msg ok";
          formEl.reset();
          await loadList();
        } catch (err) {
          msgEl.textContent = err.message;
          msgEl.className = "msg error";
        } finally {
          submitEl.disabled = false;
        }
      });

      loadList();
    </script>
  </body>
</html>
